<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Limpeza de Dados</title>
</head>
<body>

    <h1> Adicione seus Itens </h1>

        <p id="Itens"> </p>

        <input type="text" name="Adicione" id="adicionar">
        <input type="button" value="Adcionar" onclick="add()">

        <input type="button" value="Limpar" onclick="limpar()">

        <script>

            var txt = document.getElementById('Itens')
            var ad = document.getElementById('adicionar')

            function add(){
                txt.innerHTML = ad.value
            }

            function limpar(){
                txt.innerHTML = ""
            }


        </script>


</body>
</html>
