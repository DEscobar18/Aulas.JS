<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERADORES</title>
</head>
<body>
    <script>
        var n1 = prompt('Digite um numero:')
        var n2 = prompt('Digite outro numero:')

        var res = parseInt(n1) + parseInt(n2)

        alert(`A soma de ${n1} + ${n2} = ${res}`)

        var inc = 10
        
        while (res < inc){
            res++
        }

        var inc = 10 - parseInt(n1) - parseInt(n2)

        alert(`O valor que foi incremtado = ${inc}`)

    </script>
</body>
</html>
