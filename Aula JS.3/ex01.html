<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERADORES</title>
</head>
<body>
    <script>
        number = prompt('Digite um numero:')
        number2 = prompt('Digite outro numero:')

        res = parseInt(number) + parseInt(number2)

        document.write(`A soma de ${number} + ${number2} = ${res}`)
    </script>
</body>
</html>
